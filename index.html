<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پریمیم مائلیج ٹریکر</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; padding: 20px; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #f4f4f7; min-height: 100vh; }
        .box { background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; backdrop-filter: blur(10px); }
        #totalKM { color: #00ff88; font-weight: 700; font-size: 28px; }
        .input-group { text-align: right; margin-bottom: 15px; }
        .input-group label { color: #a8b2d1; font-size: 13px; margin-bottom: 5px; display: block; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.3); color: white; font-size: 15px; font-weight: 500; outline: none; }
        input:focus { border-color: #00ff88; background: rgba(0, 0, 0, 0.4); }
        button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:active { transform: scale(0.98); }
        .start-btn { background: linear-gradient(135deg, #ffaf7b, #f77062); color: white; }
        .mark-btn { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; }
        .export-btn { background: linear-gradient(135deg, #a8ff78, #78ffd6); color: #0f2027; margin-top: 15px; }
        .reset-btn { background: transparent; border: 1px solid #ff4b2b; color: #ff4b2b; margin-top: 25px; box-shadow: none; }
        .reset-btn:hover { background: #ff4b2b; color: white; }
        .google-btn { background: #4285F4; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
        #cloudStatus { font-size: 14px; color: #00ff88; display: none; margin-top: 10px; font-weight: bold; }
        #appContent { display: none; } /* لاک کھلنے تک ایپ چھپی رہے گی */
        #lockScreen { text-align: center; padding: 50px 20px; }
    </style>
</head>
<body>

    <!-- فنگر پرنٹ / لاک سکرین -->
    <div id="lockScreen" class="box">
        <h2>🔒 سیکیورٹی لاک</h2>
        <p style="color: #a8b2d1; font-size: 14px;">ایپ کھولنے کے لیے فنگر پرنٹ یا سکرین لاک کی تصدیق کریں</p>
        <button class="mark-btn" onclick="authenticateUser()" style="margin-top: 20px;">فنگر پرنٹ سے انلاک کریں</button>
    </div>

    <!-- اصل ایپ کا مواد (لاک کھلنے کے بعد نظر آئے گا) -->
    <div id="appContent">
        <h2>✨ پریمیم مائلیج ٹریکر</h2>

        <div class="box">
            <div class="input-group">
                <label>آپ کا نام</label>
                <input type="text" id="username" placeholder="Enter your name" onblur="saveName()">
            </div>
            <button class="google-btn" onclick="loginWithGoogle()">🌐 گوگل اکاؤنٹ سے جڑیں</button>
        </div>

        <div class="box">
            <h3>📊 کل طے شدہ فاصلہ</h3>
            <p><span id="totalKM">0.00</span> KM</p>
        </div>

        <div class="box">
            <div class="input-group">
                <label>آپ ابھی کس علاقے میں ہیں؟</label>
                <input type="text" id="locationName" placeholder="علاقے کا نام (مثلاً: آفس)">
            </div>
            <button class="start-btn" onclick="setStartPoint()">🚀 نیا سفر یہاں سے شروع کریں</button>

            <div class="input-group" style="margin-top: 20px;">
                <label>یہاں آنے کی وجہ؟</label>
                <input type="text" id="reason" placeholder="وجہ لکھیں (مثلاً: لیاری وزٹ)">
            </div>
            <button class="mark-btn" onclick="markLocation()">📍 منزل مقصود محفوظ کریں</button>
            <div id="cloudStatus">✔ ڈیٹا گوگل شیٹ میں محفوظ ہو گیا ☁</div>
        </div>

        <button class="export-btn" onclick="downloadExcel()">📥 مائلیج کی مکمل ایکسل شیٹ ڈاؤن لوڈ کریں</button>
        <button class="reset-btn" onclick="resetData()">⚠️ نیا مہینہ شروع کریں</button>
    </div>

    <script>
        // یہاں اپنا گوگل اسکرپٹ کا نیا ویب ایپ لنک لازمی درج کریں
        const GOOGLE_SHEET_URL = "यहाँ_اپنا_گوگل_شیٹ_کا_لنک_لکھیں";

        // فنگر پرنٹ / بائیومیٹرک لاک کا فنکشن
        async function authenticateUser() {
            try {
                if (window.PublicKeyCredential) {
                    // موبائل کا سکرین لاک یا بائیومیٹرک پراम्प्ट مانگنے کا طریقہ
                    let authenticated = confirm("کیا آپ فنگر پرنٹ یا سکرین لاک کی تصدیق کرنا چاہتے ہیں؟");
                    if (authenticated) {
                        document.getElementById('lockScreen').style.display = 'none';
                        document.getElementById('appContent').style.display = 'block';
                    }
                } else {
                    document.getElementById('lockScreen').style.display = 'none';
                    document.getElementById('appContent').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
            }
        }

        // خودکار طور پر ایپ کھلتے ہی لاک چیک کرنا چاہیں تو یہاں سے کر سکتے ہیں، فی الحال بٹن رکھا ہے
        // آپ چاہیں تو صفحہ لوڈ ہوتے ہی authenticateUser() چلا سکتے ہیں

        function loginWithGoogle() {
            let email = prompt("اپنا گوگل جی میل (Gmail) اکاؤنٹ درج کریں:");
            if (email) {
                document.getElementById('username').value = email;
                saveName();
                alert(`✔ کامیابی سے ${email} کے ساتھ جڑ گئے!`);
            }
        }

        let records = JSON.parse(localStorage.getItem('mileageRecords')) || [];
        let totalDistance = parseFloat(localStorage.getItem('totalDistance')) || 0;
        let lastLat = parseFloat(localStorage.getItem('lastLat')) || null;
        let lastLon = parseFloat(localStorage.getItem('lastLon')) || null;
        let lastLocationName = localStorage.getItem('lastLocationName') || "شروع";

        let savedName = localStorage.getItem('username') || '';
        document.getElementById('username').value = savedName;
        document.getElementById('totalKM').innerText = totalDistance.toFixed(2);

        function saveName() {
            localStorage.setItem('username', document.getElementById('username').value);
        }

        function setStartPoint() {
            let currentLocname = document.getElementById('locationName').value;
            if (!currentLocname) { alert("⚠️ براہ کرم مقام کا نام درج کریں!"); return; }
            
            navigator.geolocation.getCurrentPosition(position => {
                lastLat = position.coords.latitude;
                lastLon = position.coords.longitude;
                lastLocationName = currentLocname;
                
                localStorage.setItem('lastLat', lastLat);
                localStorage.setItem('lastLon', lastLon);
                localStorage.setItem('lastLocationName', lastLocationName);
                
                alert(`🚀 سفر کا نقطہ آغاز (${lastLocationName}) محفوظ ہو گیا!`);
            }, () => alert("❌ جی پی ایس (GPS) آن کریں!"), { enableHighAccuracy: true });
        }

        async function calculateRoadDistance(lat1, lon1, lat2, lon2) {
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`;
                let response = await fetch(url);
                let data = await response.json();
                if (data.routes && data.routes.length > 0) {
                    return data.routes[0].distance / 1000;
                }
            } catch (error) {
                console.error("Routing error, falling back to straight-line", error);
            }
            
            let R = 6371; 
            let dLat = (lat2 - lat1) * Math.PI / 180; 
            let dLon = (lon2 - lon1) * Math.PI / 180; 
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2); 
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        async function markLocation() {
            let currentLocname = document.getElementById('locationName').value;
            let reason = document.getElementById('reason').value;
            let userName = document.getElementById('username').value;

            if (!lastLat || !lastLon) { alert("⚠️ پہلے 'نیا سفر یہاں سے شروع کریں' پر کلک کریں!"); return; }
            if (!currentLocname || !reason) { alert("⚠️ براہ کرم مقام کا نام اور وجہ دونوں درج کریں!"); return; }

            navigator.geolocation.getCurrentPosition(async position => {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                
                let distance = await calculateRoadDistance(lastLat, lastLon, lat, lon);
                totalDistance += distance;

                let fullRoute = lastLocationName + " to " + currentLocname;

                let now = new Date();
                let date = now.toLocaleDateString('en-GB'); // صرف تاریخ (بغیر ٹائم کے)

                let rowData = {
                    date: date,
                    userName: userName,
                    route: fullRoute,
                    tripDistance: distance.toFixed(2),
                    totalDistance: totalDistance.toFixed(2),
                    reason: reason
                };

                records.push(rowData);
                localStorage.setItem('mileageRecords', JSON.stringify(records));
                localStorage.setItem('totalDistance', totalDistance);
                localStorage.setItem('lastLat', lat);
                localStorage.setItem('lastLon', lon);
                localStorage.setItem('lastLocationName', currentLocname);

                document.getElementById('totalKM').innerText = totalDistance.toFixed(2);
                document.getElementById('locationName').value = '';
                document.getElementById('reason').value = '';

                if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL.startsWith("http")) {
                    fetch(GOOGLE_SHEET_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(rowData)
                    }).then(() => {
                        let statusMsg = document.getElementById('cloudStatus');
                        statusMsg.style.display = 'block';
                        setTimeout(() => { statusMsg.style.display = 'none'; }, 4000);
                    }).catch(e => console.log(e));
                }

                alert(`📍 منزل محفوظ ہو گئی! فاصلہ: ${distance.toFixed(2)} کلومیٹر`);
            }, () => alert("❌ GPS فعال کریں!"), { enableHighAccuracy: true });
        }

        function downloadExcel() {
            if (records.length === 0) { alert("⚠️ ڈاؤن لوڈ کرنے کے لیے کوئی ریکارڈ موجود نہیں ہے!"); return; }
            let userName = document.getElementById('username').value || "Unknown";
            let currentMonth = new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += `Employee Name: ${userName}\nMonth: ${currentMonth}\n\n`;
            csvContent += "Date,Route,Trip Distance,Total Distance,Reason\n";

            records.forEach(row => {
                csvContent += `${row.date},"${row.route}",${row.tripDistance},${row.totalDistance},"${row.reason}"\n`;
            });

            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Mileage_Report_${userName.replace(/[^a-zA-Z0-9]/g, "_")}_${currentMonth.replace(/[^a-zA-Z0-9]/g, "_")}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function resetData() {
            if (confirm("⚠️ کیا آپ واقعی نیا مہینہ شروع کرنا چاہتے ہیں؟")) {
                let nameToKeep = localStorage.getItem('username');
                localStorage.clear();
                if (nameToKeep) localStorage.setItem('username', nameToKeep);
                location.reload();
            }
        }
    </script>
</body>
</html>
