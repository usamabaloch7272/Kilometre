<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مائلیج ٹریکر</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center; }
        h2 { color: #333; font-size: 24px; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        .start-btn { background-color: #ff9800; color: white; border: none; cursor: pointer; font-weight: bold; }
        .mark-btn { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        .export-btn { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        .input-group { text-align: right; margin-bottom: 10px; }
        .input-group label { font-weight: bold; font-size: 14px; color: #555; }
    </style>
</head>
<body>
    <h2>میرا مائلیج ٹریکر</h2>
    <div class="box">
        <h3>ٹوٹل فاصلہ: <span id="totalKm">0.00</span> KM</h3>
        
        <div class="input-group">
            <label>آپ ابھی کس علاقے میں ہیں؟</label>
            <input type="text" id="locationName" placeholder="علاقے کا نام لکھیں (جیسے: لیاری، کلفٹن)">
        </div>

        <button class="start-btn" onclick="setStartPoint()">🚀 نیا سفر یہاں سے شروع کریں</button>
        <p style="font-size: 12px; color: gray; margin-top: 5px;">پہلی بار گھر سے نکلتے وقت موجودہ علاقے کا نام لکھ کر یہ دبائیں</p>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

        <div class="input-group">
            <label>یہاں آنے کی وجہ؟</label>
            <input type="text" id="reason" placeholder="وجہ لکھیں (مثلاً: فائل دینی تھی)">
        </div>
        
        <button class="mark-btn" onclick="markLocation()">📍 منزل مقصود محفوظ کریں</button>
    </div>
    <button class="export-btn" onclick="downloadExcel()">📥 مہینے کی مکمل ایکسل شیٹ ڈاؤن لوڈ کریں</button>
    <button style="background-color: #dc3545; color: white; border: none; margin-top: 30px;" onclick="resetData()">⚠️ نیا مہینہ شروع کریں (پچھلا سارا ڈیٹا صاف کریں)</button>

    <script>
        let records = JSON.parse(localStorage.getItem('mileageRecords')) || [];
        let totalDistance = parseFloat(localStorage.getItem('totalDistance')) || 0;
        let lastLat = parseFloat(localStorage.getItem('lastLat')) || null;
        let lastLon = parseFloat(localStorage.getItem('lastLon')) || null;
        let lastLocationName = localStorage.getItem('lastLocationName') || "نامعلوم علاقہ";

        document.getElementById('totalKm').innerText = totalDistance.toFixed(2);

        function setStartPoint() {
            let currentLocName = document.getElementById('locationName').value;
            if (!currentLocName) {
                alert("براہ کرم پہلے علاقے کا نام لکھیں جہاں سے آپ سفر شروع کر رہے ہیں!");
                return;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    lastLat = position.coords.latitude;
                    lastLon = position.coords.longitude;
                    lastLocationName = currentLocName; // نیا علاقہ یاد کر لیا
                    
                    localStorage.setItem('lastLat', lastLat);
                    localStorage.setItem('lastLon', lastLon);
                    localStorage.setItem('lastLocationName', lastLocationName);
                    
                    alert("✅ شروعات سیٹ ہو گئی! (" + lastLocationName + ") سے سفر شروع۔");
                }, () => { 
                    alert("موبائل کی لوکیشن (GPS) آن کریں اور براؤزر کو اجازت دیں!"); 
                }, { enableHighAccuracy: true });
            } else { 
                alert("آپ کا موبائل GPS سپورٹ نہیں کرتا۔"); 
            }
        }

        function markLocation() {
            let currentLocName = document.getElementById('locationName').value;
            let reason = document.getElementById('reason').value;
            
            if (!currentLocName || !reason) { 
                alert("براہ کرم علاقے کا نام اور جانے کی وجہ دونوں لکھیں!"); 
                return; 
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    let distance = 0;
                    
                    // پچھلے علاقے سے نئے علاقے کا روٹ بنائیں
                    let fullRoute = lastLocationName + " to " + currentLocName;

                    if (lastLat !== null && lastLon !== null) {
                        distance = calculateDistance(lastLat, lastLon, lat, lon);
                        totalDistance += distance;
                    }

                    // اگلی باری کے لیے موجودہ علاقے کو پچھلا علاقہ بنا دیں
                    lastLat = lat;
                    lastLon = lon;
                    lastLocationName = currentLocName;
                    
                    let now = new Date();
                    let date = now.toLocaleDateString('en-GB'); 
                    let time = now.toLocaleTimeString();

                    // ریکارڈ محفوظ کریں
                    records.push({ 
                        date: date, 
                        time: time, 
                        route: fullRoute, 
                        tripDistance: distance.toFixed(2), 
                        totalDistance: totalDistance.toFixed(2), 
                        reason: reason 
                    });
                    
                    localStorage.setItem('mileageRecords', JSON.stringify(records));
                    localStorage.setItem('totalDistance', totalDistance);
                    localStorage.setItem('lastLat', lastLat);
                    localStorage.setItem('lastLon', lastLon);
                    localStorage.setItem('lastLocationName', lastLocationName);

                    document.getElementById('totalKm').innerText = totalDistance.toFixed(2);
                    document.getElementById('locationName').value = '';
                    document.getElementById('reason').value = '';
                    alert("✅ روٹ: (" + fullRoute + ") کامیابی سے محفوظ ہو گیا!");
                }, () => { 
                    alert("موبائل کی لوکیشن (GPS) آن کریں!"); 
                }, { enableHighAccuracy: true });
            } else { 
                alert("آپ کا موبائل GPS سپورٹ نہیں کرتا۔"); 
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            let R = 6371; 
            let dLat = (lat2 - lat1) * Math.PI / 180;
            let dLon = (lon2 - lon1) * Math.PI / 180;
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function downloadExcel() {
            if (records.length === 0) { 
                alert("ڈاؤن لوڈ کرنے کے لیے کوئی ریکارڈ موجود نہیں ہے!"); 
                return; 
            }
            
            // شیٹ میں اب Route (راستہ) کا کالم شامل کر دیا گیا ہے
            let csvContent = "Date,Time,Route(Area to Area),Trip_Distance(KM),Total_Distance(KM),Reason\n";
            records.forEach(row => {
                csvContent += `${row.date},${row.time},${row.route},${row.tripDistance},${row.totalDistance},${row.reason}\n`;
            });

            let blob = new Blob(["\uFEFF"+csvContent], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            let url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "Company_Mileage_Report.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function resetData() {
            if(confirm("کیا آپ واقعی سارا پرانا ریکارڈ ڈیلیٹ کر کے نیا مہینہ شروع کرنا چاہتے ہیں؟")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
